project:
  name: cryptoinvestor
  description: Plataforma de trading algorítmico con frontend React, backend Fastify y robot Python
  stack:
    frontend: React 18 + Vite + TypeScript + Tailwind CSS + Recharts
    auth: Supabase Auth (PostgreSQL)
    backend: Fastify + TypeScript + MongoDB
    robot: Python (fuera de scope de backend)
  conventions:
    - Todos los artefactos SDD en openspec/
    - Código en inglés, UI en español si es el idioma del producto
    - Strict TDD cuando hay tests
  testing:
    frontend:
      runner: Jest 30
      transformer: ts-jest 29
      framework: Testing Library (React, DOM, jest-dom, user-event)
      mocks: MSW 2
      env: jsdom
      config: jest.config.cjs
      tsconfig: tsconfig.test.json
      test_command: "npm test"
      test_count: 28
      coverage_lines: "77.27%"
      coverage_branches: "76.16%"
    backend:
      runner: Node --test (native)
      loader: tsx
      http: Supertest
      config: backend/tsconfig.test.json
      test_command: "cd backend && npm test"
      test_count: 15
      coverage_lines: "98.30%"
      coverage_branches: "91.04%"
    robot:
      runner: none
      test_command: none
      status: placeholder
    strict_tdd: true
    total_test_count: 43
    notes:
      - CI pipeline not configured
      - No ESLint or Prettier detected
      - Python robot has no tests yet
