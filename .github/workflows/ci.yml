# ============================================
# CryptoInvestor — CI Pipeline
# ============================================
# Corre typecheck y tests en push a main y PRs.
#
# Secrets requeridos en GitHub (Settings → Secrets and variables → Actions):
#
#   CI / Development (needed for tests to pass):
#     SUPABASE_URL               — https://tu-proyecto-ci.supabase.co
#     SUPABASE_SERVICE_ROLE_KEY  — service_role_key de Supabase CI
#     MASTER_KEY                 — node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#
#   Producción (needed for deployment / Raspberry Pi):
#     PROD_SUPABASE_URL             — URL del proyecto Supabase de producción
#     PROD_SUPABASE_SERVICE_ROLE_KEY — service_role key de producción
#     PROD_SUPABASE_ANON_KEY         — anon key de producción
#     PROD_MONGODB_URI               — URI de MongoDB Atlas de producción
#     PROD_MASTER_KEY                — Master key de producción
#     PROD_DOMAIN                    — Dominio DuckDNS (ej: api.tu-proyecto.duckdns.org)
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # FRONTEND: typecheck
  # ─────────────────────────────────────────────
  typecheck-frontend:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # BACKEND: typecheck
  # ─────────────────────────────────────────────
  typecheck-backend:
    name: Typecheck Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: cd backend && npm ci
      - run: cd backend && npx tsc --noEmit

  # ─────────────────────────────────────────────
  # FRONTEND: tests (Jest + jsdom, sin infra)
  # ─────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test

  # ─────────────────────────────────────────────
  # BACKEND: tests (Node native runner + MongoDB)
  # ─────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/cryptoinvestor
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MASTER_KEY: ${{ secrets.MASTER_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test
