# ============================================
# Nginx config — frontend React (container)
# ============================================
#
# Montar como volumen en el container nginx:alpine:
#   ./deploy/default.conf:/etc/nginx/conf.d/default.conf:ro
#   ./dist:/usr/share/nginx/html:ro
#
# Cloudflare Tunnel termina TLS en el edge,
# así que acá solo va HTTP en puerto 80.
# ============================================

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor performance
    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 256;

    # Cacheo agresivo para assets con hash (Vite genera nombres únicos)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
