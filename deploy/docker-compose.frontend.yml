# ============================================
# CryptoInvestor — Frontend Service
# ============================================
#
# Servicio independiente para servir el frontend
# React compilado con nginx:alpine.
#
# Uso standalone:
#   npm run build
#   docker compose -f deploy/docker-compose.frontend.yml up -d
#
# Integración en el docker-compose.yml maestro de la Pi:
#   services:
#     cryptoinvestor-frontend:
#       <<: *frontend-defaults
#       volumes:
#         - ./cryptoinvestor-plataforma/dist:/usr/share/nginx/html:ro
#         - ./cryptoinvestor-plataforma/deploy/default.conf:/etc/nginx/conf.d/default.conf:ro
#
# Cloudflare Tunnel termina TLS en el edge,
# así que el container solo expone HTTP (puerto 80).
# No necesita exponer puertos públicos si cloudflared
# lo alcanza por red interna de Docker.
# ============================================

services:
  cryptoinvestor-frontend:
    image: nginx:alpine
    container_name: cryptoinvestor-frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Build output del frontend
      - ./dist:/usr/share/nginx/html:ro
      # Config personalizada con gzip, cacheo y SPA routing
      - ./deploy/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  default:
    name: cryptoinvestor-network
    external: true
